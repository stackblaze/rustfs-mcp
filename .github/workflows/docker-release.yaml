name: Docker Build and Push

# On any vX.Y.Z* tag (auto-tag pushes vX.Y.Z-sb.NN), build the image, push it
# to GHCR, and publish a GitHub Release. The rustfs-mcp Deployment in ns
# kubero-mcp pulls ghcr.io/stackblaze/rustfs-mcp:<tag>.

on:
  push:
    tags: [ 'v*.*.*' ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: stackblaze/rustfs-mcp

jobs:
  build:
    runs-on: [self-hosted, kubero]
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.CHAIN_PAT || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists; skipping create."
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "Auto-published from docker-release.yaml." \
              --latest
          fi
